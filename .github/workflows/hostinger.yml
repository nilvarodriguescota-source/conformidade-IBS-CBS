# Publica o site na Hostinger. A cada push na branch principal: roda os testes, gera public/ e
# grava o resultado na branch "hostinger", que a Hostinger puxa pelo recurso Git do hPanel.
# Também deixa o site num .zip ("site-para-hostinger") para quem preferir subir pelo Gerenciador
# de Arquivos. Passo a passo: docs/kiwify-supabase/PASSO-A-PASSO.md (etapa 5).
name: Site para a Hostinger

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger
  cancel-in-progress: true

jobs:
  publicar:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Gravar o site na branch hostinger
        working-directory: public
        run: |
          git init -q -b hostinger
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Site gerado de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" hostinger
      - uses: actions/upload-artifact@v4
        with:
          name: site-para-hostinger
          path: public
          include-hidden-files: true
