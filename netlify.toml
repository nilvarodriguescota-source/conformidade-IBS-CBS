# Prévia no Netlify: roda o build e publica a pasta public/. O site oficial fica na Hostinger
# (.github/workflows/hostinger.yml e site/hospedagem/.htaccess, que faz o mesmo que este arquivo).
# O sistema roda inteiro no navegador (Web Worker); o webhook da Kiwify é uma função do Supabase.
# A raiz (index.html) é o site comercial; o sistema fica em sistema.html.
[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    # Login e área do cliente não podem ser embutidos por outros sites (a área do cliente embute o sistema, mesma origem)
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/dados/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Ambiente de testes (prévia do Netlify): a raiz abre direto o sistema de XML, sem login
# (site/config/ambiente.ts). O site comercial continua em /index.html. Este arquivo não vale para
# a Hostinger (produção), que usa site/hospedagem/.htaccess e mantém o login obrigatório.
# Para voltar a exigir login na prévia: apague este bloco e defina ACESSO_LIVRE=0 no Netlify.
[[redirects]]
  from = "/"
  to = "/sistema.html"
  status = 200
  force = true

# Site comercial em /index.html; o sistema de XML fica em /sistema.html (área do cliente em /conta.html).
# Endereços sem ".html", para links e divulgação.
[[redirects]]
  from = "/entrar"
  to = "/entrar.html"
  status = 200

[[redirects]]
  from = "/cadastro"
  to = "/cadastro.html"
  status = 200

[[redirects]]
  from = "/recuperar-senha"
  to = "/recuperar-senha.html"
  status = 200

[[redirects]]
  from = "/definir-senha"
  to = "/definir-senha.html"
  status = 200

[[redirects]]
  from = "/checkout"
  to = "/checkout.html"
  status = 200

[[redirects]]
  from = "/conta"
  to = "/conta.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/conta.html"
  status = 301

[[redirects]]
  from = "/sistema"
  to = "/sistema.html"
  status = 200
